[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egx-research"
version = "0.1.0"
description = "Local EGX30 ETF research, optimization, and reporting toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lxml>=6.0",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "optuna>=3.6",
  "plotly>=5.24",
  "requests>=2.32",
  "scikit-learn>=1.8",
  "scipy>=1.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
egx = "egx_research.cli:app"

[tool.setuptools.packages.find]
include = ["egx_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
