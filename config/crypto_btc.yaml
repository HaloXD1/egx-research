data:
  symbol: BTCUSDT
  asset: btc
  quote: USDT
  interval: 1d
  raw_dir: data/crypto/raw
  normalized_dir: data/crypto/normalized
  features_dir: data/crypto/features
  normalized_filename: BTCUSDT_1d.csv
  features_filename: BTCUSDT_daily_features.csv

sources:
  price_start: "2017-01-01"
  onchain_start: "2017-01-01"
  macro_start: "2017-01-01"
  funding_start: "2019-09-10"
  coinmetrics_metrics:
    - PriceUSD
    - CapMVRVCur
    - AdrActCnt
    - TxCnt
    - HashRate
    - SplyCur
    - FlowInExUSD
    - FlowOutExUSD
  macro_series:
    NASDAQCOM: nasdaq
    DGS10: us10y
    DTWEXBGS: dollar
    WALCL: fed_liquidity
    VIXCLS: vix
  optional_sources:
    coinmetrics:
      enabled: true
      env_var: ""
      required: false
    fear_greed:
      enabled: true
      env_var: ""
      required: false
    macro:
      enabled: true
      env_var: ""
      required: false
    funding_rates:
      enabled: true
      env_var: ""
      required: false
    btc_etf_flows:
      enabled: true
      env_var: ""
      required: false
    open_interest:
      enabled: true
      env_var: ""
      required: false
    futures_positioning:
      enabled: true
      env_var: ""
      required: false
    coinbase_premium:
      enabled: true
      env_var: ""
      required: false
    stablecoin_supply:
      enabled: true
      env_var: ""
      required: false
    exchange_stablecoin_reserves:
      enabled: false
      env_var: EXCHANGE_STABLECOIN_RESERVES_API_KEY
      required: false
    options_skew:
      enabled: true
      env_var: DERIBIT_API_KEY
      required: false
    liquidations:
      enabled: false
      env_var: COINGLASS_API_KEY
      required: false
    exchange_flows:
      enabled: false
      env_var: CRYPTOQUANT_API_KEY
      required: false
    glassnode_sth_sopr:
      enabled: false
      env_var: GLASSNODE_API_KEY
      required: false


backtest:
  initial_cash: 100000.0
  monthly_contribution: 10000.0
  fee_bps: 10.0
  slippage_bps: 5.0
  share_precision: 8
  annualization_periods: 365.0

search:
  families:
    - crypto_price_trend
    - crypto_trend_adx
    - crypto_donchian_breakout
    - crypto_supertrend_combo
    - crypto_pullback_combo
    - crypto_dca_overlay
    - crypto_onchain_overlay
    - crypto_sentiment_overlay
    - crypto_macro_overlay
    - crypto_ensemble_overlay
    - crypto_hierarchy_combo
    - crypto_multisignal_score
  trials_per_family: 150
  top_candidates_per_family: 8
  random_seed: 42
  robustness_neighbor_steps: 1
  objective_mode: walk_forward_score

bottom_quality:
  primary_horizon_days: 60
  primary_tolerance: 0.05
  max_forward_drawdown: 0.15
  false_bottom_penalty_enabled: true
  confirmation_required_for_adds: true
  cycle_phase_enabled: true
  tranche_policy: "20/30/30/20"

validation:
  holdout_ratio: 0.2
  primary_train_bars: 1095
  primary_test_bars: 365
  primary_step_bars: 180
  fallback_train_bars: 365
  fallback_test_bars: 180
  fallback_step_bars: 90
  outer_test_bars: 365
  outer_step_bars: 365
  purge_bars: 5
  embargo_bars: 5

ranking:
  weights:
    return_dd: 0.4
    cagr: 0.2
    profit_factor: 0.1
    sharpe: 0.2
    excess_return_vs_dca: 0.1
  filters:
    min_closed_trades: 0
    max_drawdown: 0.8
    min_profit_factor: 0.0
    min_holdout_excess_return: -0.2
    min_neighbor_pass_rate: 0.5
